<form class="app-shell" [formGroup]="aiForm" (ngSubmit)="onSubmit()"
  [style.--verdict-ink]="verdictTheme.ink" [style.--verdict-tint]="verdictTheme.tint">

  <app-screen-nav [(lang)]="lang" [refControl]="aiForm.controls.refReport" (printRequested)="mePrint()" />

  <app-print-sheet [lang]="lang()" [view]="corrosionview" [headHtml]="headPrintTemplate" [reference]="refreportPrint"
    [date]="printDate" [verdictLabel]="verdictLabel" [icorrText]="icorrText" [deltaE]="deltaE" [densityText]="densityText" />

  <div class="app-body">
    <div class="rail ungest-print">
      <app-measurement-card [controls]="aiForm.controls" [lang]="lang()" [hint]="hint" />
      <app-verdict-card class="verdict-card" [lang]="lang()" [verdictLabel]="verdictLabel" [icorrText]="icorrText"
        [deltaE]="deltaE" [densityText]="densityText" />
    </div>

    <div class="blueprint chart-card">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <app-theecanvas [usercurve]="corrosionview" [verdictKey]="verdictKey" [lang]="lang()"
        (dragMove)="onDragMove($event)"></app-theecanvas>
    </div>
  </div>

  <app-info-block [lang]="lang()" />

  @if (showingdebug) {
    <div class="px-4 debug-aiform ungest-print">
      <h3>Debug</h3>
      <p class="form-text">
        status : {{ aiForm.status }}
        <br />
        dirty : {{ aiForm.dirty }}
      </p>
      <div class="form-text text-muted">
        <pre>{{ aiForm.value | json }}</pre>
      </div>
    </div>
  }
</form>
